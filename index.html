<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>シンプル学習プランナー（青×白）</title>
<style>
  :root{
    --bg:#ffffff; --text:#0f172a; --muted:#5b6b8c;
    --blue:#1976d2; --blue-700:#0d47a1; --blue-50:#e3f2fd;
    --line:#e6eef8; --pill:#f6f9fe; --ok:#2e7d32; --danger:#d32f2f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,#fff,#ffffffe6);
    border-bottom:1px solid var(--line);padding:10px 14px}
  h1{margin:0;font-size:1.1rem;color:var(--blue-700);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 12px 0}
  .tabbtn{border:1px solid var(--line);background:#fff;color:var(--blue-700);padding:8px 12px;border-radius:10px;cursor:pointer}
  .tabbtn.active{background:linear-gradient(180deg,#2196f3,#1976d2);color:#fff;border-color:#1976d2}
  main{max-width:900px;margin:0 auto;padding:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
  label{display:block;margin:.45rem 0 .2rem;font-size:.9rem;color:var(--muted)}
  input,select,textarea,button{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);
    font-size:.95rem;outline:none;transition:box-shadow .15s,border-color .15s
  }
  input:focus,select:focus,textarea:focus{border-color:#b6d6ff;box-shadow:0 0 0 3px #b6d6ff55}
  textarea{min-height:96px;resize:vertical}
  .row{display:grid;gap:10px}
  @media(min-width:800px){ .row2{grid-template-columns:repeat(2,1fr)} .row3{grid-template-columns:repeat(3,1fr)} }
  .btn{cursor:pointer;background:linear-gradient(180deg,#2196f3,#1976d2);color:#fff;border:none;font-weight:700}
  .btn.ghost{background:#fff;border:1px dashed #c9defa;color:#1976d2}
  .btn.ok{background:linear-gradient(180deg,#43a047,#2e7d32)}
  .btn.danger{background:linear-gradient(180deg,#ef5350,#d32f2f)}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:.78rem;color:#1976d2}
  .list{list-style:none;padding:0;margin:0}
  .list li{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:.35rem 0;background:#fff}
  .muted{color:var(--muted)} .tiny{font-size:.8rem}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{border:1px solid var(--line);border-radius:12px;min-height:82px;padding:8px;background:#fff}
  .date{font-size:.78rem;color:var(--muted);margin-bottom:4px}
  .tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:2px 4px 0 0}
  .tag.rev{background:#e8f2ff;border-color:#cfe4ff}
  .tag.new{background:#e9f7ef;border-color:#cfead8}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi .box{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi .val{font-weight:800}
  .center{display:flex;gap:10px;align-items:center;justify-content:center}
  .qcard{font-size:1.05rem;padding:16px;border:2px solid #e6eef8;border-radius:12px;background:#fff}
  .q{font-weight:800}
  .a{margin-top:8px;padding:10px;border-radius:8px;background:#f6f9fe;border:1px solid #e6eef8}
  svg{width:100%;height:220px;border:1px solid var(--line);border-radius:12px;background:#fff}
</style>
</head>
<body>
<header>
  <h1>シンプル学習プランナー</h1>
  <div class="tabs">
    <button class="tabbtn active" data-tab="plan">計画</button>
    <button class="tabbtn" data-tab="manage">管理</button>
    <button class="tabbtn" data-tab="quiz">クイズ</button>
    <button class="tabbtn" data-tab="stats">グラフ</button>
  </div>
</header>

<main>
  <!-- ===== 計画 ===== -->
  <section id="tab-plan" class="card">
    <div class="row row3">
      <div>
        <label>今日の学習時間（分）</label>
        <input id="minutesToday" type="number" min="0" step="5" value="90">
      </div>
      <div>
        <label>先読み日数</label>
        <input id="horizon" type="number" min="7" max="60" step="1" value="21">
      </div>
      <div>
        <label>新規/復習の比率（新規0.0〜1.0）</label>
        <input id="newWeight" type="number" min="0" max="1" step="0.05" value="0.5">
      </div>
    </div>
    <div class="kpi" style="margin-top:8px">
      <div class="box"><div class="tiny muted">本日の残時間</div><div class="val" id="kpiTime">—</div></div>
      <div class="box"><div class="tiny muted">今日の復習（件）</div><div class="val" id="kpiRev">—</div></div>
      <div class="box"><div class="tiny muted">今日の新規（件）</div><div class="val" id="kpiNew">—</div></div>
    </div>
    <div class="center" style="margin-top:10px">
      <button class="btn ok" id="makePlan">今日の計画を作成</button>
      <button class="btn ghost" id="reflowNew">新規の将来日割り</button>
    </div>
    <ul class="list" id="todayList" style="margin-top:8px"></ul>
    <div class="card" style="padding:10px;margin-top:10px">
      <div class="tiny muted">先読み（復習/新規の見込み）</div>
      <div class="calendar" id="calendar"></div>
    </div>
  </section>

  <!-- ===== 管理（ページ内入力） ===== -->
  <section id="tab-manage" class="card" style="display:none">
    <h3>科目・単元・クイズをページ内で追加</h3>
    <div class="row row2">
      <div>
        <label>科目名</label>
        <input id="subjName" placeholder="世界史Bなど">
      </div>
      <div>
        <label>試験日</label>
        <input id="examDate" type="date">
      </div>
    </div>
    <div class="row row3" style="margin-top:6px">
      <div>
        <label>1単元の目安時間（分）</label>
        <input id="defaultUnitMins" type="number" min="5" value="15">
      </div>
      <div>
        <label>難易度（復習間隔は自動計算）</label>
        <select id="defaultDiff">
          <option value="easy">易</option>
          <option value="normal" selected>普</option>
          <option value="hard">難</option>
        </select>
      </div>
      <div style="display:flex;align-items:end"><button class="btn" id="addSubject">科目を追加</button></div>
    </div>

    <div class="row" style="margin-top:10px">
      <div>
        <label>対象科目</label>
        <select id="targetSubject"></select>
      </div>
      <div>
        <label>単元（1行=1件, 形式：タイトル | 分(任意) | 難易度(任意)）</label>
        <textarea id="unitsBulk" placeholder="例:
イスラーム世界の成立 | 20 | normal
十字軍遠征 | 15
モンゴル帝国 | 15 | hard"></textarea>
      </div>
    </div>
    <button class="btn" id="addUnits">単元を追加</button>

    <div class="row" style="margin-top:10px">
      <div>
        <label>一問一答（Q|A形式, 1行=1問。空欄はスキップ）</label>
        <textarea id="qaBulk" placeholder="例:
ローマの水道橋を英語で？ | aqueduct
ボストン茶会事件を主導した組織は？ | 自由の息子たち（Sons of Liberty）
張騫が派遣された地域名は？ | 西域"></textarea>
      </div>
    </div>
    <button class="btn" id="addQA">クイズを追加</button>

    <div class="center" style="margin-top:10px">
      <button class="btn ghost" id="clearAll">全データ削除</button>
    </div>

    <h4 style="margin-top:14px">登録状況</h4>
    <ul class="list" id="subjectsList"></ul>
  </section>

  <!-- ===== クイズ ===== -->
  <section id="tab-quiz" class="card" style="display:none">
    <div class="row row2">
      <div>
        <label>科目で絞り込み</label>
        <select id="quizSubject"></select>
      </div>
      <div>
        <label>出題数（0=全部）</label>
        <input id="quizCount" type="number" min="0" value="0">
      </div>
    </div>
    <div class="center" style="margin-top:8px">
      <button class="btn" id="startQuiz">クイズ開始</button>
      <button class="btn ghost" id="resetQuiz">リセット</button>
    </div>
    <div id="quizArea" style="margin-top:10px;display:none">
      <div class="qcard">
        <div class="tiny muted" id="qProgress">0/0</div>
        <div class="q" id="qText">—</div>
        <div class="a" id="aText" style="display:none">—</div>
      </div>
      <div class="center" style="margin-top:8px">
        <button class="btn" id="showAns">答えを表示</button>
        <button class="btn ok" id="markGood" style="display:none">正解（覚えた）</button>
        <button class="btn danger" id="markBad" style="display:none">不正解（あとで）</button>
      </div>
    </div>
  </section>

  <!-- ===== グラフ ===== -->
  <section id="tab-stats" class="card" style="display:none">
    <div class="row row2">
      <div>
        <label>範囲（日数）</label>
        <input id="statDays" type="number" min="7" max="120" value="30">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" id="drawChart">グラフを更新</button>
      </div>
    </div>
    <div style="margin-top:8px">
      <svg id="chart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="tiny muted">※ 毎日の「完了」操作を集計し、日別件数（棒）＋累計（線）を描画</div>
    </div>
  </section>
</main>

<script>
(function(){
  const $ = s=>document.querySelector(s);
  const $$ = s=>document.querySelectorAll(s);
  const todayISO = iso(new Date());

  // ====== State ======
  const state = load() || {
    subjects:[],            // {id,name,examDate,defaultMins,defaultDiff}
    units:{},               // unitId -> {id, title, mins, diff, subjectId, learned:false, lastDone:null}
    qa:[],                  // {id, q, a, subjectId}
    schedule:{},            // date -> { unitId: {review:0/1, new:0/1} }
    progressLog:{}          // date -> { done: number }
  };

  // ====== Utils ======
  function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
  function addDays(isoStr, n){ const d=new Date(isoStr); d.setDate(d.getDate()+n); return iso(d); }
  function daysBetween(aISO,bISO){ const a=new Date(aISO), b=new Date(bISO); return Math.ceil((b-a)/86400000); }
  function daysUntil(dateISO){ return Math.max(0, daysBetween(todayISO, dateISO)); }
  function save(){ localStorage.setItem("simple_planner_bw", JSON.stringify(state)); }
  function load(){ try{ return JSON.parse(localStorage.getItem("simple_planner_bw")); }catch(e){ return null; } }
  function ensureDay(dateISO){ state.schedule[dateISO] = state.schedule[dateISO] || {}; return state.schedule[dateISO]; }
  function ensureUnitSlot(day, uid){ day[uid] = day[uid] || {review:0,new:0}; return day[uid]; }
  function kFromDiff(d){ if(d==='easy') return 0.10; if(d==='hard') return 0.35; return 0.20; }
  function tCritical(k, threshold=0.60){ return Math.max(1, Math.round(-Math.log(threshold)/k)); }
  function weightByUrgency(days){ return 1/Math.pow(days+1,2); }

  // ====== Tabs ======
  $$(".tabbtn").forEach(btn=>{
    btn.onclick = ()=>{
      $$(".tabbtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      ["plan","manage","quiz","stats"].forEach(id=>{
        $("#tab-"+id).style.display = (id===tab)? "block":"none";
      });
      if(tab==="stats") drawChart();
    };
  });

  // ====== Manage ======
  function refreshSubjectSelects(){
    const sels = [$("#targetSubject"), $("#quizSubject")];
    sels.forEach(sel=>{
      sel.innerHTML="";
      state.subjects
        .sort((a,b)=> new Date(a.examDate)-new Date(b.examDate))
        .forEach(s=>{
          const o=document.createElement("option");
          o.value=s.id; o.textContent=`${s.name}（${s.examDate}）`;
          sel.appendChild(o);
        });
    });
  }

  $("#addSubject").onclick = ()=>{
    const name=$("#subjName").value.trim();
    const examDate=$("#examDate").value;
    const defaultMins=parseInt($("#defaultUnitMins").value,10)||15;
    const defaultDiff=$("#defaultDiff").value;
    if(!name || !examDate){ alert("科目名と試験日を入力"); return; }
    state.subjects.push({id:crypto.randomUUID(),name,examDate,defaultMins,defaultDiff});
    save();
    $("#subjName").value=""; $("#examDate").value="";
    refreshSubjectSelects(); renderSubjectsList();
  };

  $("#addUnits").onclick = ()=>{
    const sid=$("#targetSubject").value; if(!sid){ alert("科目を選択"); return; }
    const subj = state.subjects.find(s=>s.id===sid);
    const lines=$("#unitsBulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(lines.length===0){ alert("単元を1行以上"); return; }
    lines.forEach((line,i)=>{
      const [t,m,d] = line.split("|").map(s=> (s||"").trim());
      const u={ id:crypto.randomUUID(), title:(t||`単元${i+1}`), mins:parseInt(m||subj.defaultMins,10), diff:(d||subj.defaultDiff).toLowerCase(), subjectId:sid, learned:false, lastDone:null };
      state.units[u.id]=u;
    });
    save();
    $("#unitsBulk").value="";
    renderSubjectsList();
  };

  $("#addQA").onclick = ()=>{
    const sid=$("#targetSubject").value; if(!sid){ alert("科目を選択"); return; }
    const lines=$("#qaBulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(lines.length===0){ alert("Q|Aを1行以上"); return; }
    lines.forEach(line=>{
      const p=line.split("|"); if(p.length<2) return;
      const q=(p[0]||"").trim(), a=(p[1]||"").trim(); if(!q||!a) return;
      state.qa.push({id:crypto.randomUUID(), q, a, subjectId:sid});
    });
    save(); $("#qaBulk").value="";
    alert("クイズを登録しました");
  };

  $("#clearAll").onclick = ()=>{
    if(confirm("全データを削除しますか？")){
      localStorage.removeItem("simple_planner_bw"); location.reload();
    }
  };

  function renderSubjectsList(){
    const ul=$("#subjectsList"); ul.innerHTML="";
    const grouped={};
    Object.values(state.units).forEach(u=>{
      grouped[u.subjectId] = grouped[u.subjectId] || {total:0,done:0};
      grouped[u.subjectId].total++;
      if(u.learned) grouped[u.subjectId].done++;
    });
    state.subjects.forEach(s=>{
      const g=grouped[s.id]||{total:0,done:0};
      const li=document.createElement("li");
      li.innerHTML=`
        <div>
          <div><b>${s.name}</b> <span class="pill">${s.examDate}</span></div>
          <div class="tiny muted">単元 ${g.done}/${g.total}・既定 ${s.defaultMins}分/件・難:${s.defaultDiff}</div>
        </div>
        <div>
          <button class="btn ghost tiny" data-act="view" data-id="${s.id}">単元一覧</button>
          <button class="btn danger tiny" data-act="del" data-id="${s.id}">削除</button>
        </div>`;
      ul.appendChild(li);

      const box=document.createElement("div");
      box.style.display="none";
      box.style.margin="6px 0 10px";
      const units = Object.values(state.units).filter(u=>u.subjectId===s.id);
      box.innerHTML = units.length? `<ol class="tiny" style="margin:.3rem 0 .1rem 1rem">${units.map(u=>
        `<li>${u.learned?"✅":"⬜"} ${u.title} <span class="pill">${u.mins}分</span> <span class="pill">難:${u.diff}</span>
          <button class="btn ghost tiny" data-uact="toggle" data-uid="${u.id}">完了切替</button>
        </li>`).join("")}</ol>` : `<div class="tiny muted">単元なし</div>`;
      ul.appendChild(box);

      ul.addEventListener("click",(e)=>{
        const b=e.target.closest("button"); if(!b) return;
        if(b.dataset.id===s.id && b.dataset.act==="view"){
          box.style.display = (box.style.display==="none")? "block":"none";
        }else if(b.dataset.id===s.id && b.dataset.act==="del"){
          if(!confirm("この科目と関連データを削除しますか？")) return;
          // remove units, schedule, qa
          const uids = Object.values(state.units).filter(u=>u.subjectId===s.id).map(u=>u.id);
          for(const date in state.schedule){ uids.forEach(uid=> delete state.schedule[date][uid]); }
          uids.forEach(uid=> delete state.units[uid]);
          state.qa = state.qa.filter(x=>x.subjectId!==s.id);
          state.subjects = state.subjects.filter(x=>x.id!==s.id);
          save(); renderSubjectsList(); refreshSubjectSelects(); renderCalendar();
        }
        if(b.dataset.uact==="toggle"){
          const u=state.units[b.dataset.uid]; if(!u) return;
          u.learned=!u.learned; u.lastDone = u.learned? todayISO : null;
          if(u.learned){ addProgress(1); scheduleReviewsForUnit(u); }
          save(); renderSubjectsList(); renderCalendar();
        }
      }, {once:false});
    });
    refreshSubjectSelects();
  }

  // ====== Planning ======
  function makeTodayPlan(){
    const minutesToday=parseInt($("#minutesToday").value,10)||0;
    $("#kpiTime").textContent = minutesToday+"分";
    const newWeight = parseFloat($("#newWeight").value)||0.5;

    // 今日の復習（自動予約されたもの）
    const today = ensureDay(todayISO);
    const reviewUnits = Object.keys(today).filter(uid=> today[uid].review>0).map(uid=> state.units[uid]).filter(Boolean);
    const revMin = reviewUnits.reduce((s,u)=> s + Math.max(3, Math.round(u.mins*0.6)), 0);

    let timeLeft = Math.max(0, minutesToday - revMin);

    // 新規候補：科目の近さで重み付け、未学習を順に
    const cands = state.subjects.map(s=>{
      const leftDays = daysUntil(s.examDate);
      const w = weightByUrgency(leftDays);
      const list = Object.values(state.units).filter(u=>u.subjectId===s.id && !u.learned).sort((a,b)=> (a.order||0)-(b.order||0));
      return {s, w, list};
    }).filter(x=>x.list.length>0);
    const W = cands.reduce((a,c)=>a+c.w,0) || 1;
    const newPick=[];
    if(timeLeft>0){
      cands.forEach(c=>{
        const shareMin = timeLeft * (c.w/W) * newWeight;
        let used=0;
        for(const u of c.list){
          if(used + u.mins <= shareMin + 0.01){ newPick.push(u); used+=u.mins; } else { break; }
        }
      });
    }

    // 表示
    const ul=$("#todayList"); ul.innerHTML="";
    let nRev=0, nNew=0;
    reviewUnits.forEach(u=>{
      nRev++;
      const li=document.createElement("li");
      li.innerHTML = `<div><b>復習</b>：${u.title} <span class="pill">${u.mins}分</span></div>
        <div><label class="tiny muted"><input type="checkbox" data-type="rev" data-uid="${u.id}"> 完了</label></div>`;
      ul.appendChild(li);
    });
    newPick.forEach(u=>{
      nNew++;
      const li=document.createElement("li");
      li.innerHTML = `<div><b>新規</b>：${u.title} <span class="pill">${u.mins}分</span></div>
        <div><label class="tiny muted"><input type="checkbox" data-type="new" data-uid="${u.id}"> 完了</label></div>`;
      ul.appendChild(li);
    });
    $("#kpiRev").textContent = nRev; $("#kpiNew").textContent = nNew;

    // 完了で更新
    ul.addEventListener("change",(e)=>{
      const cb=e.target; if(cb.tagName!=="INPUT" || !cb.checked) return;
      const uid=cb.dataset.uid, type=cb.dataset.type;
      const u=state.units[uid]; if(!u) return;
      if(type==="new"){
        u.learned=true; u.lastDone=todayISO; addProgress(1); scheduleReviewsForUnit(u);
      }else{
        const day=ensureDay(todayISO); if(day[uid]) day[uid].review=0;
        // 不安なら翌日にもう一回
        const next=addDays(todayISO,1); ensureUnitSlot(ensureDay(next), uid).review=1;
      }
      save(); renderSubjectsList(); renderCalendar();
    }, {once:false});
  }

  // 復習スケジュール（完全自動）
  function scheduleReviewsForUnit(u){
    const k = kFromDiff(u.diff);
    const tC = tCritical(k, 0.60);                 // しきい値直前まで
    const base = [0,1,3,7,14,30,45,60].filter(d=> d<=tC); // 超シンプル
    base.forEach(d=>{
      const date = addDays(todayISO, d);
      const day = ensureDay(date); ensureUnitSlot(day, u.id).review=1;
    });
  }

  // 新規の将来割り（軽量版）：未学習を試験日まで均す
  function reflowNew(){
    for(const date in state.schedule){
      for(const uid in state.schedule[date]) state.schedule[date][uid].new=0;
    }
    const horizon = parseInt($("#horizon").value,10)||21;
    state.subjects.forEach(s=>{
      const span = Math.min(horizon, Math.max(1, daysBetween(todayISO, s.examDate)));
      const queue = Object.values(state.units).filter(u=>u.subjectId===s.id && !u.learned);
      queue.forEach((u, i)=>{
        const dayOffset = Math.min(span-1, Math.floor(i * (span/Math.max(1,queue.length))));
        const date = addDays(todayISO, dayOffset+1);
        ensureUnitSlot(ensureDay(date), u.id).new=1;
      });
    });
    save(); renderCalendar(); alert("新規の将来日割りを行いました。");
  }

  // ====== Calendar ======
  function renderCalendar(){
    const cal=$("#calendar"); cal.innerHTML="";
    const horizon = parseInt($("#horizon").value,10)||21;
    for(let i=0;i<horizon;i++){
      const date = addDays(todayISO, i);
      const d = new Date(date), wd=["日","月","火","水","木","金","土"][d.getDay()];
      const box=document.createElement("div"); box.className="day";
      box.innerHTML=`<div class="date">${date}（${wd}）</div>`;
      const day = state.schedule[date]||{};
      for(const uid in day){
        const u=state.units[uid]; if(!u) continue;
        if(day[uid].review>0){ const t=document.createElement("div"); t.className="tag rev"; t.textContent="復:"+u.title; box.appendChild(t); }
        if(day[uid].new>0){ const t=document.createElement("div"); t.className="tag new"; t.textContent="新:"+u.title; box.appendChild(t); }
      }
      cal.appendChild(box);
    }
  }

  // ====== Quiz ======
  let quizQueue=[], quizIdx=0, quizGood=0;
  function resetQuizUI(){
    $("#quizArea").style.display="none";
    $("#qText").textContent="—"; $("#aText").textContent="—"; $("#aText").style.display="none";
    $("#markGood").style.display="none"; $("#markBad").style.display="none";
    $("#qProgress").textContent="0/0";
  }

  $("#startQuiz").onclick = ()=>{
    const sid=$("#quizSubject").value || null;
    const N=parseInt($("#quizCount").value,10)||0;
    let pool = state.qa.filter(x=> !sid || x.subjectId===sid);
    if(pool.length===0){ alert("クイズが登録されていません"); return; }
    // シャッフル
    pool = shuffle(pool);
    if(N>0) pool = pool.slice(0,N);
    quizQueue = pool; quizIdx=0; quizGood=0;
    $("#quizArea").style.display="block";
    showCurrentQuestion();
  };
  $("#resetQuiz").onclick = resetQuizUI;

  $("#showAns").onclick = ()=>{
    $("#aText").style.display="block";
    $("#markGood").style.display="inline-block";
    $("#markBad").style.display="inline-block";
  };
  $("#markGood").onclick = ()=>{
    quizGood++;
    nextQuestion(true);
  };
  $("#markBad").onclick = ()=>{
    // 間違えたら末尾にもう一度入れる（とても簡易なSR）
    quizQueue.push(quizQueue[quizIdx]);
    nextQuestion(false);
  };

  function showCurrentQuestion(){
    if(quizIdx>=quizQueue.length){ endQuiz(); return; }
    const cur=quizQueue[quizIdx];
    $("#qText").textContent = cur.q;
    $("#aText").textContent = cur.a;
    $("#aText").style.display="none";
    $("#markGood").style.display="none";
    $("#markBad").style.display="none";
    $("#qProgress").textContent = `${Math.min(quizIdx+1, quizQueue.length)}/${quizQueue.length}`;
  }
  function nextQuestion(correct){
    quizIdx++;
    showCurrentQuestion();
  }
  function endQuiz(){
    $("#qText").textContent=`完了：${quizGood} / ${quizQueue.length} 正解`;
    $("#aText").style.display="none";
    $("#markGood").style.display="none";
    $("#markBad").style.display="none";
  }
  function shuffle(arr){
    const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
  }

  // ====== Stats (SVG 原始棒＋線) ======
  function addProgress(n){
    const d=todayISO;
    state.progressLog[d] = state.progressLog[d] || {done:0};
    state.progressLog[d].done += n;
  }
  $("#drawChart").onclick = drawChart;
  function drawChart(){
    const days = Math.max(7, parseInt($("#statDays").value,10)||30);
    const svg=$("#chart"); while(svg.firstChild) svg.removeChild(svg.firstChild);
    const w=600, h=220, pad=30, innerW=w-pad*2, innerH=h-pad*2;
    // データ
    const xs=[], ys=[]; let cum=0, maxY=1;
    for(let i=days-1;i>=0;i--){
      const d = addDays(todayISO, -i);
      const n = (state.progressLog[d]?.done)||0;
      xs.push(d); ys.push(n); cum+=n; if(n>maxY) maxY=n;
    }
    // 軸
    const gLine=(x1,y1,x2,y2,cls="")=>{
      const l=document.createElementNS("http://www.w3.org/2000/svg","line");
      l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
      l.setAttribute("stroke","#bcd6fb"); l.setAttribute("stroke-width","1"); svg.appendChild(l);
    };
    // 枠
    gLine(pad,pad, pad, h-pad);
    gLine(pad,h-pad, w-pad, h-pad);
    // 棒グラフ
    const barW = innerW/days*0.7;
    ys.forEach((v,i)=>{
      const x = pad + i*(innerW/days) + (innerW/days - barW)/2;
      const y = h-pad - (v/(maxY||1))* (innerH*0.8);
      const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x",x); rect.setAttribute("y",y);
      rect.setAttribute("width",barW); rect.setAttribute("height", Math.max(1,(h-pad-y)));
      rect.setAttribute("fill","#90caf9");
      rect.setAttribute("stroke","#64b5f6");
      svg.appendChild(rect);
    });
    // 累計線
    let running=0, pts=[];
    ys.forEach((v,i)=>{ running+=v;
      const x = pad + i*(innerW/days) + (innerW/days)/2;
      const y = h-pad - (running/Math.max(1,running))* (innerH*0.15) - innerH*0.8 - 2; // 上部に小さく
      pts.push([x, Math.max(pad, y)]);
    });
    if(pts.length){
      const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
      p.setAttribute("points", pts.map(p=>p.join(",")).join(" "));
      p.setAttribute("fill","none"); p.setAttribute("stroke","#1976d2"); p.setAttribute("stroke-width","2");
      svg.appendChild(p);
    }
  }

  // ====== Wire up ======
  $("#makePlan").onclick = makeTodayPlan;
  $("#reflowNew").onclick = reflowNew;

  // ====== Init ======
  renderSubjectsList();
  refreshSubjectSelects();
  renderCalendar();
  makeTodayPlan();
  drawChart();
})();
<script>
/* ------- PWA: manifest & Service Worker を動的生成（iOS/Android両対応） ------- */
(function(){
  // manifest.json を動的に作る
  const manifest = {
    name: "シンプル学習プランナー",
    short_name: "学習プランナー",
    start_url: "./",
    display: "standalone",
    background_color: "#ffffff",
    theme_color: "#1976d2",
    icons: [
      { src: "icon-180.png", sizes: "180x180", type: "image/png", purpose: "any" }
    ]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/json"}));
  document.head.appendChild(link);

  // 最低限のオフライン対応 SW を登録
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'simple-planner-v1';
      const CORE = ['.','index.html','icon-180.png'];
      self.addEventListener('install', e=>{
        e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)));
        self.skipWaiting();
      });
      self.addEventListener('activate', e=>{
        e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e=>{
        if(e.request.method!=='GET') return;
        e.respondWith(
          caches.match(e.request).then(r=> r || fetch(e.request).then(net=>{
            const copy = net.clone(); caches.open(CACHE).then(c=>c.put(e.request, copy)); return net;
          }).catch(()=> caches.match('./')))
        );
      });
    `;
    const swURL = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
    navigator.serviceWorker.register(swURL);
  }
})();
</script>
